<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="description" content="MailCal — Email & Calendar Manager" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js" async></script>
  <title>MailCal</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:         #0d0d0d;
      --panel:      #111111;
      --card:       #161616;
      --card-h:     #1c1c1c;
      --border:     #222222;
      --border-s:   #191919;
      --accent:     #6366f1;
      --accent-d:   rgba(99,102,241,.12);
      --accent-b:   rgba(99,102,241,.25);
      --text:       #e4e4e7;
      --muted:      #71717a;
      --dim:        #3f3f46;
      --green:      #22c55e;
      --orange:     #f97316;
      --red:        #ef4444;
      --gmail:      #ea4335;
      --outlook:    #0078d4;
      --gemini:     #4285f4;
      --claude:     #d97706;
      --openai:     #10a37f;
      --ollama:     #7c3aed;
      --email-color: #6366f1;
      --cal-color:   #6366f1;
      --ai-color:    #6366f1;
      --events-color:#6366f1;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh; overflow: hidden; font-size: 14px; line-height: 1.4;
      opacity: 0; transition: opacity .18s ease;
    }
    body.ready { opacity: 1; }

    /* ── Shell ───────────────────────────────────────────── */
    .app { display: grid; grid-template-rows: 52px 1fr; height: 100vh; }
    .body-wrap { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr; overflow: hidden; height: calc(100vh - 52px); }

    /* ── Topbar ──────────────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; padding: 0 20px; gap: 16px;
      background: var(--panel); border-bottom: 1px solid var(--border); z-index: 10;
    }
    .logo {
      display: flex; align-items: center; gap: 9px;
      font-weight: 700; font-size: 15px; letter-spacing: -.4px; min-width: 180px;
    }
    .logo-icon {
      width: 30px; height: 30px; background: var(--accent); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .search-wrap { flex: 1; max-width: 480px; position: relative; }
    .search-wrap input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px 7px 34px; color: var(--text);
      font-size: 13px; outline: none; transition: border-color .2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-icon {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 15px; pointer-events: none;
    }
    .topbar-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 32px; height: 32px; background: var(--card); border: 1px solid var(--border);
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted); font-size: 15px; transition: all .15s;
      position: relative;
    }
    .icon-btn:hover { background: var(--card-h); color: var(--text); }
    .notif::after {
      content: ''; position: absolute; top: 5px; right: 5px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--red);
      border: 2px solid var(--panel);
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; cursor: pointer;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 14px 10px;
      overflow-y: auto; gap: 2px;
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .compose-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
      margin-bottom: 14px; transition: opacity .2s; width: 100%; font-family: inherit;
    }
    .compose-btn:hover { opacity: .85; }

    .nav-lbl {
      font-size: 10px; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--dim); padding: 6px 10px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13px;
      transition: background .15s, color .15s;
    }
    .nav-item:hover { background: var(--card); color: var(--text); }
    .nav-item.active { background: var(--accent-d); color: var(--accent); font-weight: 500; }
    .nav-item .ni { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .badge {
      margin-left: auto; background: var(--accent); color: #fff; font-size: 10px;
      font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center;
    }
    .badge.r { background: var(--red); }
    .sidebar-sep { height: 1px; background: var(--border-s); margin: 8px 0; }
    .sidebar-brand {
      font-size: 16px; font-weight: 800; letter-spacing: -.4px;
      color: var(--accent); padding: 4px 10px 14px; flex-shrink: 0;
    }

    /* ── Home / Overview ─────────────────────────────────── */
    .home-greeting { display: flex; align-items: baseline; gap: 12px; }
    .home-greeting-name { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
    .home-greeting-date { font-size: 13px; color: var(--muted); }

    .widget-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      align-items: start;
    }
    .widget {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 14px; overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .widget.drag-over {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-b);
    }
    .widget.dragging { opacity: .35; }
    .widget.expanded { grid-column: 1 / -1; }
    .widget-header {
      display: flex; align-items: center; gap: 8px;
      padding: 13px 14px 11px; border-bottom: 1px solid var(--border-s);
    }
    .widget-drag {
      color: var(--dim); font-size: 14px; cursor: grab;
      user-select: none; line-height: 1; padding: 1px 3px;
      border-radius: 4px; transition: color .15s;
    }
    .widget-drag:hover { color: var(--muted); }
    .widget-drag:active { cursor: grabbing; }
    .widget-icon { font-size: 16px; flex-shrink: 0; }
    .widget-title { font-size: 13px; font-weight: 600; flex: 1; }
    .widget-action-btn {
      width: 24px; height: 24px; border: none; background: transparent;
      color: var(--dim); font-size: 14px; cursor: pointer;
      border-radius: 5px; display: flex; align-items: center; justify-content: center;
      transition: all .15s; font-family: inherit;
    }
    .widget-action-btn:hover { background: var(--card-h); color: var(--muted); }
    .widget-body { padding: 16px; }
    .widget-stat-big {
      font-size: 52px; font-weight: 900; line-height: 1; letter-spacing: -3px;
    }
    .widget-stat-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .widget-footer {
      padding: 8px 14px; border-top: 1px solid var(--border-s);
      display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.15);
    }
    .widget-footer-label { font-size: 11px; color: var(--dim); }
    .widget-footer select {
      background: transparent; border: none; color: var(--muted);
      font-size: 11px; outline: none; cursor: pointer; font-family: inherit;
    }
    .widget-footer select option { background: var(--card); }

    .event-item {
      display: flex; gap: 10px; padding: 9px 0;
      border-bottom: 1px solid var(--border-s);
    }
    .event-item:last-child { border-bottom: none; padding-bottom: 0; }
    .event-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--cal-color); margin-top: 5px; flex-shrink: 0;
    }
    .event-time { font-size: 11px; color: var(--muted); min-width: 52px; flex-shrink: 0; padding-top: 1px; }
    .event-name { font-size: 12px; font-weight: 500; }
    .event-sub { font-size: 11px; color: var(--dim); margin-top: 1px; }

    /* ── Theme / Color picker (in settings) ──────────────── */
    .accent-grid { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }
    .accent-grid { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }
    .accent-swatch {
      width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; position: relative; flex-shrink: 0;
      transition: transform .15s, box-shadow .15s;
    }
    .accent-swatch:hover { transform: scale(1.18); }
    .accent-swatch.selected { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px currentColor; }
    .accent-swatch.selected::after {
      content: '✓'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff;
    }


    /* ── Content area (swapped by views) ────────────────── */
    #content { overflow: hidden; display: flex; height: 100%; }

    /* ── Dashboard ───────────────────────────────────────── */
    .dash-grid {
      display: grid; grid-template-columns: 320px 1fr 280px;
      width: 100%; overflow: hidden;
    }

    /* Email List Panel */
    .list-panel {
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .list-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--border-s); }
    .list-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    .tabs { display: flex; gap: 2px; background: var(--card); padding: 3px; border-radius: 8px; }
    .tab {
      flex: 1; text-align: center; padding: 5px 4px; border-radius: 6px;
      font-size: 12px; color: var(--muted); cursor: pointer; transition: all .15s;
    }
    .tab.active { background: var(--panel); color: var(--text); font-weight: 500; }
    .email-list { flex: 1; overflow-y: auto; padding: 8px; }

    /* Empty States */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; height: 100%; color: var(--dim); text-align: center; padding: 24px;
    }
    .empty-icon { font-size: 40px; opacity: .4; }
    .empty-title { font-size: 14px; font-weight: 600; color: var(--muted); }
    .empty-desc { font-size: 12px; color: var(--dim); line-height: 1.6; max-width: 200px; }
    .empty-btn {
      margin-top: 4px; padding: 8px 16px; background: var(--accent-d);
      border: 1px solid var(--accent-b); border-radius: 7px; color: var(--accent);
      font-size: 12px; cursor: pointer; transition: background .2s; font-family: inherit;
    }
    .empty-btn:hover { background: rgba(99,102,241,.2); }

    /* Email Reader */
    .reader { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

    /* Right Panel */
    .right-panel {
      border-left: 1px solid var(--border); display: flex; flex-direction: column;
      overflow: hidden; background: var(--panel);
    }

    /* Mini Calendar */
    .mini-cal { padding: 16px; border-bottom: 1px solid var(--border); }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-month { font-size: 13px; font-weight: 700; }
    .cal-navs { display: flex; gap: 4px; }
    .cal-nb {
      width: 24px; height: 24px; background: var(--card); border: 1px solid var(--border);
      border-radius: 5px; color: var(--muted); font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .cal-nb:hover { background: var(--card-h); color: var(--text); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .cdlbl { text-align: center; font-size: 10px; color: var(--dim); font-weight: 600; padding: 3px 0; }
    .cd {
      text-align: center; padding: 5px 2px; border-radius: 5px; font-size: 12px;
      color: var(--muted); cursor: pointer; transition: background .15s; position: relative;
    }
    .cd:hover { background: var(--card); color: var(--text); }
    .cd.other { color: var(--dim); }
    .cd.today { background: var(--accent); color: #fff; font-weight: 700; }

    /* Upcoming */
    .upcoming { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .sec-lbl {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .1em; color: var(--dim); margin-bottom: 8px;
    }

    /* AI Chat */
    .ai-chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-head {
      padding: 11px 14px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border-s);
    }
    .ai-icon {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .chat-ttl { font-size: 13px; font-weight: 600; }
    .chat-sub { font-size: 11px; color: var(--muted); margin-left: auto; }
    .chat-msgs {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .chat-msgs::-webkit-scrollbar { width: 3px; }
    .chat-msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .bubble {
      padding: 9px 12px; border-radius: 10px; font-size: 12px;
      line-height: 1.55; max-width: 92%;
    }
    .bubble.ai {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); align-self: flex-start; border-bottom-left-radius: 3px;
    }
    .bubble.user {
      background: var(--accent); color: #fff;
      align-self: flex-end; border-bottom-right-radius: 3px;
    }
    .chat-input-row {
      padding: 10px 12px; display: flex; gap: 6px;
      border-top: 1px solid var(--border-s);
    }
    .chat-inp {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 7px; padding: 7px 10px; color: var(--text); font-size: 12px;
      outline: none; resize: none; transition: border-color .2s; font-family: inherit;
    }
    .chat-inp:focus { border-color: var(--accent); }
    .chat-inp::placeholder { color: var(--dim); }
    .send-btn {
      width: 32px; height: 32px; background: var(--accent); border: none;
      border-radius: 7px; color: #fff; font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      align-self: flex-end; transition: opacity .2s; flex-shrink: 0;
    }
    .send-btn:hover { opacity: .85; }
    .ai-disabled {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; padding: 20px; text-align: center;
    }
    .ai-disabled-icon { font-size: 28px; opacity: .3; }
    .ai-disabled-txt { font-size: 12px; color: var(--dim); line-height: 1.6; }
    .ai-disabled-btn {
      padding: 7px 14px; background: var(--accent-d); border: 1px solid var(--accent-b);
      border-radius: 7px; color: var(--accent); font-size: 11px; cursor: pointer;
      transition: background .2s; font-family: inherit;
    }
    .ai-disabled-btn:hover { background: rgba(99,102,241,.2); }

    /* ── Settings View ───────────────────────────────────── */
    .settings-view {
      display: grid; grid-template-columns: 200px 1fr;
      width: 100%; overflow: hidden;
    }
    .settings-nav {
      background: var(--panel); border-right: 1px solid var(--border);
      padding: 20px 10px; display: flex; flex-direction: column; gap: 2px;
    }
    .settings-nav-title {
      font-size: 11px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--dim); padding: 0 10px 10px;
    }
    .snav-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px;
      border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13px;
      transition: all .15s;
    }
    .snav-item:hover { background: var(--card); color: var(--text); }
    .snav-item.active { background: var(--accent-d); color: var(--accent); font-weight: 500; }
    .snav-item .sni { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }

    .settings-content {
      overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 28px;
    }
    .settings-content::-webkit-scrollbar { width: 4px; }
    .settings-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .settings-section-title {
      font-size: 18px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 4px;
    }
    .settings-section-desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

    /* Provider Cards */
    .provider-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px;
    }
    .provider-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; transition: border-color .2s;
    }
    .provider-card:hover { border-color: #333; }
    .provider-card.connected { border-color: rgba(34,197,94,.25); }

    .pcard-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .pcard-logo {
      width: 36px; height: 36px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .pcard-name { font-size: 14px; font-weight: 600; }
    .pcard-status { font-size: 12px; margin-top: 2px; }
    .pcard-status.on { color: var(--green); }
    .pcard-status.off { color: var(--muted); }
    .pcard-badge {
      margin-left: auto; font-size: 10px; font-weight: 600; padding: 3px 8px;
      border-radius: 10px; flex-shrink: 0;
    }
    .badge-free { background: rgba(34,197,94,.12); color: var(--green); border: 1px solid rgba(34,197,94,.2); }
    .badge-paid { background: rgba(249,115,22,.12); color: var(--orange); border: 1px solid rgba(249,115,22,.2); }
    .badge-local { background: rgba(124,58,237,.12); color: #a78bfa; border: 1px solid rgba(124,58,237,.2); }

    .field-group { margin-bottom: 10px; }
    .field-group label {
      display: block; font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px;
    }
    .field-group input, .field-group select {
      width: 100%; background: var(--panel); border: 1px solid var(--border);
      border-radius: 7px; padding: 8px 10px; color: var(--text); font-size: 13px;
      outline: none; transition: border-color .2s; font-family: inherit;
    }
    .field-group input:focus, .field-group select:focus { border-color: var(--accent); }
    .field-group input::placeholder { color: var(--dim); }
    .field-group input[type="password"] { letter-spacing: .1em; }
    .field-group input[type="password"]::placeholder { letter-spacing: 0; }
    .field-group select { cursor: pointer; }
    .field-group select option { background: var(--card); }

    .field-help { font-size: 11px; color: var(--dim); margin-top: 4px; }
    .field-help a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .field-help a:hover { text-decoration: underline; }

    .pcard-btn {
      width: 100%; padding: 9px; border-radius: 7px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .2s; font-family: inherit; margin-top: 4px;
    }
    .pcard-btn.connect { background: var(--accent); border: none; color: #fff; }
    .pcard-btn.connect:hover { opacity: .85; }
    .pcard-btn.disconnect {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
    }
    .pcard-btn.disconnect:hover { border-color: var(--red); color: var(--red); background: rgba(239,68,68,.05); }
    .pcard-btn.test {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
    }
    .pcard-btn.test:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-d); }

    .connected-info {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      background: rgba(34,197,94,.06); border: 1px solid rgba(34,197,94,.15);
      border-radius: 7px; margin-bottom: 10px;
    }
    .connected-info .ci-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .connected-info .ci-email { font-size: 12px; color: var(--text); }

    /* AI provider active selector */
    .ai-active-bar {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    }
    .ai-active-label { font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .ai-active-bar select {
      flex: 1; background: var(--panel); border: 1px solid var(--border);
      border-radius: 7px; padding: 7px 10px; color: var(--text); font-size: 13px;
      outline: none; font-family: inherit; cursor: pointer;
    }
    .ai-active-bar select:focus { border-color: var(--accent); }
    .ai-active-bar select option { background: var(--card); }

    /* Toggle */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--border-s);
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-info .t-name { font-size: 13px; font-weight: 500; }
    .toggle-info .t-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .toggle {
      width: 38px; height: 22px; background: var(--border); border-radius: 11px;
      cursor: pointer; position: relative; transition: background .2s; flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%; background: #fff;
      transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .toggle.on::after { left: 19px; }

    /* Save button */
    .save-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 0 0;
    }
    .save-btn {
      padding: 9px 20px; background: var(--accent); border: none; border-radius: 7px;
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .2s; font-family: inherit;
    }
    .save-btn:hover { opacity: .85; }
    .save-msg { font-size: 12px; color: var(--green); display: none; }
    .save-msg.show { display: block; }

    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    /* ── Home layout (main + right panel) ───────────────── */
    .home-view {
      display: grid; grid-template-columns: 1fr 290px; grid-template-rows: 1fr;
      width: 100%; height: 100%; overflow: hidden;
    }
    .home-main {
      overflow-y: auto; padding: 28px 28px 28px 32px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .home-main::-webkit-scrollbar { width: 4px; }
    .home-main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .home-right {
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--panel);
    }

    /* ── Actions panel ───────────────────────────────────── */
    .actions-head {
      padding: 14px 16px 10px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-s);
    }
    .actions-title {
      font-size: 11px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--dim);
    }
    .actions-count {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      background: var(--accent); color: #fff; border-radius: 10px;
    }
    .actions-list {
      flex: 1; overflow-y: auto; padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .actions-list::-webkit-scrollbar { width: 3px; }
    .actions-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .action-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 12px;
      transition: border-color .15s;
    }
    .action-card:hover { border-color: #333; }
    .action-card.urgent { border-left: 3px solid var(--red); }
    .action-card.meeting { border-left: 3px solid var(--cal-color); }
    .action-card.ai { border-left: 3px solid var(--ai-color); }
    .ac-type {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .ac-type.meeting { color: var(--cal-color); }
    .ac-type.urgent  { color: var(--red); }
    .ac-type.ai      { color: var(--ai-color); }
    .ac-type.info    { color: var(--muted); }
    .ac-text { font-size: 12px; line-height: 1.55; color: var(--text); margin-bottom: 8px; }
    .ac-btns { display: flex; gap: 6px; }
    .ac-btn {
      flex: 1; padding: 5px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 600; cursor: pointer;
      transition: all .15s; font-family: inherit; border: none;
    }
    .ac-btn.yes { background: var(--accent); color: #fff; }
    .ac-btn.yes:hover { opacity: .85; }
    .ac-btn.no {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted);
    }
    .ac-btn.no:hover { border-color: var(--red); color: var(--red); }
    .ac-btn.full {
      background: var(--accent-d); border: 1px solid var(--accent-b);
      color: var(--accent);
    }
    .ac-btn.full:hover { background: rgba(99,102,241,.2); }
    .actions-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; padding: 20px; text-align: center;
    }
    .actions-empty-icon { font-size: 28px; opacity: .25; }
    .actions-empty-txt { font-size: 11px; color: var(--dim); line-height: 1.6; }

    /* ── AI panel (bottom of right column) ──────────────── */
    .ai-mini {
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column;
      flex: 1 1 50%; min-height: 0; overflow: hidden;
    }
    .ai-mini-head {
      padding: 10px 14px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border-s); flex-shrink: 0;
    }
    .ai-mini-icon {
      width: 22px; height: 22px; border-radius: 6px;
      background: linear-gradient(135deg, var(--ai-color), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; flex-shrink: 0;
    }
    .ai-mini-title { font-size: 12px; font-weight: 600; flex: 1; }
    .ai-mini-status { font-size: 10px; color: var(--muted); }
    .ai-mini-msgs {
      flex: 1; overflow-y: auto; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .ai-mini-input {
      padding: 8px 10px; display: flex; gap: 6px;
      border-top: 1px solid var(--border-s); flex-shrink: 0;
    }
    .ai-mini-input input {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 9px; color: var(--text);
      font-size: 12px; outline: none; font-family: inherit;
      transition: border-color .2s;
    }
    .ai-mini-input input:focus { border-color: var(--accent); }
    .ai-mini-input input::placeholder { color: var(--dim); }
    .ai-mini-send {
      width: 28px; height: 28px; background: var(--ai-color);
      border: none; border-radius: 6px; color: #fff;
      font-size: 13px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: opacity .2s; flex-shrink: 0;
    }
    .ai-mini-send:hover { opacity: .85; }

    /* ── Tasks page ──────────────────────────────────────── */
    .task-action-card {
      background: linear-gradient(135deg, rgba(99,102,241,.1), rgba(99,102,241,.05));
      border: 1px solid rgba(99,102,241,.3); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 18px; cursor: pointer;
      transition: all .15s; display: flex; align-items: center; gap: 12px;
    }
    .task-action-card:hover { border-color: var(--accent); background: rgba(99,102,241,.14); }
    .task-action-icon { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); display:flex;align-items:center;justify-content:center; font-size:16px; flex-shrink:0; }
    .task-action-title { font-size: 13px; font-weight: 700; }
    .task-action-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .task-action-badge { margin-left:auto; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:700; background:var(--accent); color:#fff; flex-shrink:0; }

    .draft-progress { display:flex; flex-direction:column; gap:8px; margin-top:16px; }
    .draft-row { display:flex; align-items:center; gap:10px; padding:10px 13px; background:var(--card); border:1px solid var(--border-s); border-radius:9px; font-size:12px; }
    .draft-status { width:18px; height:18px; border-radius:50%; flex-shrink:0; display:flex;align-items:center;justify-content:center; font-size:11px; }
    .draft-status.queued  { background:var(--card-h); border:1px solid var(--border); }
    .draft-status.working { background:rgba(99,102,241,.2); border:1px solid var(--accent); animation: dg-spin .6s linear infinite; }
    .draft-status.done    { background:rgba(34,197,94,.15); border:1px solid rgba(34,197,94,.3); color:var(--green); }
    .draft-status.err     { background:rgba(239,68,68,.1);  border:1px solid rgba(239,68,68,.2); color:var(--red); }
    .tasks-view {
      display: flex; flex-direction: column;
      width: 100%; overflow: hidden; padding: 28px 32px;
    }
    .tasks-view::-webkit-scrollbar { width: 4px; }
    .page-title { font-size: 22px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 4px; }
    .page-sub   { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
    .task-input-row {
      display: flex; gap: 8px; margin-bottom: 20px;
    }
    .task-input {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 9px; padding: 10px 14px; color: var(--text);
      font-size: 13px; outline: none; font-family: inherit;
      transition: border-color .2s;
    }
    .task-input:focus { border-color: var(--accent); }
    .task-input::placeholder { color: var(--dim); }
    .task-add-btn {
      padding: 10px 18px; background: var(--accent); border: none;
      border-radius: 9px; color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity .2s; font-family: inherit;
      white-space: nowrap;
    }
    .task-add-btn:hover { opacity: .85; }
    .task-sections { display: flex; flex-direction: column; gap: 22px; overflow-y: auto; flex: 1; }
    .task-section-lbl {
      font-size: 10px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
    }
    .task-list { display: flex; flex-direction: column; gap: 4px; }
    .task-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: var(--card);
      border: 1px solid var(--border); border-radius: 9px;
      transition: border-color .15s; group: true;
    }
    .task-item:hover { border-color: #2a2a2a; }
    .task-check {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--border); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s; font-size: 10px; color: transparent;
    }
    .task-check:hover { border-color: var(--accent); color: var(--accent); }
    .task-item.done .task-check {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .task-text {
      flex: 1; font-size: 13px; line-height: 1.4;
    }
    .task-item.done .task-text { text-decoration: line-through; color: var(--dim); }
    .task-del {
      width: 24px; height: 24px; border: none; background: transparent;
      color: var(--dim); font-size: 14px; cursor: pointer;
      border-radius: 5px; display: flex; align-items: center;
      justify-content: center; opacity: 0; transition: all .15s;
      font-family: inherit;
    }
    .task-item:hover .task-del { opacity: 1; }
    .task-del:hover { background: rgba(239,68,68,.1); color: var(--red); }
    .task-empty {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; padding: 32px; text-align: center; color: var(--dim);
    }
    .task-empty-icon { font-size: 32px; opacity: .3; }
    .task-empty-txt  { font-size: 12px; line-height: 1.6; }

    /* ── Email Digest page ───────────────────────────────── */
    .digest-view { width: 100%; overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column; }
    .digest-view::-webkit-scrollbar { width: 4px; }
    .digest-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .dg-prefs-panel {
      background: var(--card); border: 1px solid var(--border-s); border-radius: 12px;
      padding: 16px 18px; margin-bottom: 18px; display: none; flex-direction: column; gap: 14px;
    }
    .dg-prefs-panel.open { display: flex; }
    .dg-prefs-title { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
    .dg-prefs-sub   { font-size: 11px; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
    .dg-prefs-row   { display: flex; flex-direction: column; gap: 5px; }
    .dg-prefs-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .dg-prefs-input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 12px; padding: 8px 11px; font-family: inherit;
      outline: none; transition: border-color .15s; resize: vertical;
    }
    .dg-prefs-input:focus { border-color: var(--accent); }
    .dg-prefs-save { align-self: flex-end; padding: 7px 16px; border-radius: 7px; font-size: 12px; font-weight: 700; background: var(--accent); border: none; color: #fff; cursor: pointer; transition: opacity .15s; }
    .dg-prefs-save:hover { opacity: .82; }
    .dg-pref-btn { padding: 4px 11px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; }
    .dg-pref-btn:hover { border-color: var(--accent); color: var(--accent); }
    .dg-pref-btn.active { background: var(--accent-d); border-color: var(--accent); color: var(--accent); }
    .dg-acct-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .dg-acct-tab  { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 600; transition: all .15s; }
    .dg-acct-tab:hover { border-color: var(--accent); color: var(--text); }
    .dg-acct-tab.on { background: var(--accent-d); border-color: var(--accent); color: var(--text); }
    .dg-topbar { display: flex; align-items: center; gap: 7px; margin-bottom: 18px; flex-wrap: wrap; }
    .dg-title  { font-size: 20px; font-weight: 800; letter-spacing: -.4px; margin-right: 4px; }
    .dg-pill   { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; }
    .dg-pill:hover { border-color: var(--accent); color: var(--text); }
    .dg-pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dg-refresh { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; margin-left: auto; transition: all .15s; display:flex;align-items:center;justify-content:center; }
    .dg-refresh:hover { border-color: var(--accent); color: var(--accent); }
    .dg-refresh.spin { animation: dg-spin .6s linear infinite; }
    @keyframes dg-spin { to { transform: rotate(360deg); } }

    .dg-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .dg-stat  { background: var(--card); border: 1px solid var(--border-s); border-radius: 12px; padding: 14px 16px; position: relative; overflow: hidden; }
    .dg-stat-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .dg-stat-num { font-size: 28px; font-weight: 900; letter-spacing: -1px; line-height: 1; margin-bottom: 3px; }
    .dg-stat-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .dg-stat-icon { position: absolute; bottom: 10px; right: 12px; font-size: 18px; opacity: .12; }

    .dg-ai-card { background: var(--card); border: 1px solid var(--border-s); border-radius: 12px; padding: 15px 18px; margin-bottom: 18px; }
    .dg-ai-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .dg-ai-icon { width: 22px; height: 22px; border-radius: 5px; background: var(--ai-color); display:flex;align-items:center;justify-content:center; font-size: 11px; color: #fff; flex-shrink:0; }
    .dg-ai-label { font-size: 12px; font-weight: 700; }
    .dg-ai-by { font-size: 11px; color: var(--muted); margin-left: auto; }
    .dg-ai-btn { padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 700; background: var(--ai-color); border: none; color: #fff; cursor: pointer; transition: opacity .15s; }
    .dg-ai-btn:hover { opacity: .82; }
    .dg-ai-btn:disabled { opacity: .45; cursor: not-allowed; }
    .dg-ai-out { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .dg-urgent-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .dg-urgent-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.15); border-radius: 8px; font-size: 11px; }
    .dg-urgent-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
    .dg-priority-box { padding: 8px 10px; background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.2); border-radius: 7px; font-size: 11px; color: var(--text); margin-bottom: 6px; }

    .dg-section { margin-bottom: 20px; }
    .dg-sec-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .dg-sec-count { padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 700; background: var(--card); border: 1px solid var(--border); }
    .dg-emails { display: flex; flex-direction: column; gap: 4px; }
    .dg-row { display: flex; align-items: flex-start; gap: 10px; background: var(--card); border: 1px solid var(--border-s); border-radius: 10px; padding: 10px 12px; transition: border-color .15s, background .15s; }
    .dg-row:hover { border-color: var(--border); background: var(--card-h); }
    .dg-av { width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0; display:flex;align-items:center;justify-content:center; font-size: 12px; font-weight: 800; color: #fff; }
    .dg-body { flex: 1; min-width: 0; }
    .dg-sender-line { display: flex; align-items: center; gap: 5px; margin-bottom: 1px; }
    .dg-sender { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    .dg-badge-imp { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 700; flex-shrink: 0; background: rgba(249,115,22,.15); color: var(--orange); }
    .dg-badge-old { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 700; flex-shrink: 0; background: rgba(239,68,68,.12); color: var(--red); }
    .dg-subj { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
    .dg-snip { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dg-time { font-size: 11px; color: var(--dim); flex-shrink: 0; padding-top: 1px; }
    .dg-empty { font-size: 12px; color: var(--dim); padding: 10px 0 4px; }
    .dg-skel { height: 52px; border-radius: 10px; margin-bottom: 4px; background: linear-gradient(90deg, var(--card) 25%, var(--card-h) 50%, var(--card) 75%); background-size: 200% 100%; animation: dg-shim 1.2s infinite; }
    @keyframes dg-shim { to { background-position: -200% 0; } }
    .digest-connect-cta { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 48px 24px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 14px; }
    .digest-connect-icon { font-size: 40px; opacity: .3; }
    .digest-connect-title { font-size: 16px; font-weight: 700; }
    .digest-connect-desc { font-size: 13px; color: var(--muted); max-width: 320px; line-height: 1.6; }

    /* ── Landing Page ────────────────────────────────────── */
    .landing-screen {
      position: fixed; inset: 0; background: var(--bg);
      overflow-y: auto; z-index: 100;
    }
    .landing-wrap { max-width: 900px; margin: 0 auto; padding: 0 24px 60px; }
    .landing-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0; border-bottom: 1px solid var(--border-s);
    }
    .landing-nav-logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
    .landing-signin-link {
      padding: 7px 16px; background: var(--card); border: 1px solid var(--border);
      border-radius: 7px; color: var(--muted); font-size: 13px; cursor: pointer;
      transition: all .15s; font-family: inherit;
    }
    .landing-signin-link:hover { color: var(--text); background: var(--card-h); }

    .landing-hero { text-align: center; padding: 64px 0 48px; }
    .landing-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent-d); border: 1px solid var(--accent-b);
      color: #818cf8; font-size: 12px; font-weight: 600;
      padding: 5px 14px; border-radius: 20px; margin-bottom: 24px;
      letter-spacing: .04em;
    }
    .landing-headline {
      font-size: clamp(40px, 8vw, 68px); font-weight: 800;
      letter-spacing: -2px; line-height: 1.05; margin-bottom: 20px;
    }
    .landing-gradient {
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .landing-sub {
      font-size: 17px; color: var(--muted); line-height: 1.7; max-width: 540px;
      margin: 0 auto 36px;
    }
    .landing-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
    .landing-install-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 28px; background: var(--accent); border: none;
      border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity .2s, transform .15s; font-family: inherit;
      box-shadow: 0 0 30px rgba(99,102,241,.3);
    }

// Auth state: 'no_session' | 'pending' | 'approved' | 'denied'
let AUTH_SESSION = null;

async function getAuthStatus() {
  const sb = getSB();
  if (!sb) return 'no_session';
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return 'no_session';
  AUTH_SESSION = session;
  const { data } = await sb.from('accounts').select('status').eq('id', session.user.id).single();
  return data ? data.status : 'pending';
}

async function sbSignUp(name, email, password) {
  const sb = getSB();
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) throw error;
  await sb.from('accounts').upsert({
    id: data.user.id, email, name, status: 'pending', created_at: new Date().toISOString()
  });
  AUTH_SESSION = data.session;
  return data;
}

async function sbSignIn(email, password) {
  const sb = getSB();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  AUTH_SESSION = data.session;
  await sb.from('accounts').update({ last_seen: new Date().toISOString() }).eq('id', data.user.id);
  return data;
}

async function sbSignOut() {

// ── Profile Store ─────────────────────────────────────────────────
function getPStore() {
  try { return JSON.parse(localStorage.getItem('mailcal_profiles')) || { active: null, profiles: {} }; }

}
function savePStore(s) { localStorage.setItem('mailcal_profiles', JSON.stringify(s)); }

function getActiveProfile() {
  const s = getPStore();
  return s.active ? s.profiles[s.active] : null;
}

function _deepMerge(base, over) {
  const out = Object.assign({}, base);
  for (const k in over) {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) &&
        base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
      out[k] = _deepMerge(base[k], over[k]);
    } else {
      out[k] = over[k];
    }
  }
  return out;
}
function loadCfg() {
  const p = getActiveProfile();
  const stored = (p && p.config) ? p.config : null;
  const cfg = stored ? _deepMerge(structuredClone(DEFAULTS), stored) : structuredClone(DEFAULTS);
  // Migrate old flat digest format {userContext, vipSenders, ...} to per-account
  if (cfg.digest && typeof cfg.digest.userContext === 'string') {
    const old = cfg.digest;
    cfg.digest = {
      gmail:   { userContext: old.userContext || '', vipSenders: old.vipSenders || '', lowPriority: old.lowPriority || '', filterNoise: old.filterNoise !== false },
      outlook: { userContext: '', vipSenders: '', lowPriority: '', filterNoise: true },
    };
  }
  return cfg;
}
function saveCfg(cfg) {
  const s = getPStore();
  if (s.active && s.profiles[s.active]) {
    s.profiles[s.active].config = cfg;
    savePStore(s);
  }
}

  const lbl = calCur.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const firstDow = new Date(y, m, 1).getDay();
  const total    = new Date(y, m + 1, 0).getDate();
  const prevLast = new Date(y, m, 0).getDate();
  const DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  let h = DAYS.map(d => `<div class="cdlbl">${d}</div>`).join('');
  for (let i = 0; i < firstDow; i++)
    h += `<div class="cd other">${prevLast - firstDow + i + 1}</div>`;
  for (let d = 1; d <= total; d++) {
    const isToday = d === now.getDate() && m === now.getMonth() && y === now.getFullYear();
    h += `<div class="cd ${isToday ? 'today' : ''}">${d}</div>`;
  }

  return `
    <div class="mini-cal">
      <div class="cal-head">
        <div class="cal-month">${lbl}</div>
        <div class="cal-navs">
          <button class="cal-nb" onclick="shiftCal(-1)">‹</button>
          <button class="cal-nb" onclick="shiftCal(1)">›</button>
        </div>
      </div>
      <div class="cal-grid">${h}</div>
    </div>`;
}

function shiftCal(d) {
  calCur = new Date(calCur.getFullYear(), calCur.getMonth() + d, 1);
  // re-render just the calendar widget
  const panel = document.querySelector('.mini-cal');
  if (panel) panel.outerHTML = renderCalWidget();
  // after replacing, re-query won't work; re-render whole right panel
  renderDashboard();
}

let _dragWidget = null;

function widgetDragStart(e, el) {
  _dragWidget = el;
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function widgetDragEnd(el) {
  el.classList.remove('dragging');
  document.querySelectorAll('.widget.drag-over').forEach(w => w.classList.remove('drag-over'));
  _dragWidget = null;
}
function widgetDragOver(e, el) {
  e.preventDefault();
  if (_dragWidget && _dragWidget !== el) {
    document.querySelectorAll('.widget.drag-over').forEach(w => w.classList.remove('drag-over'));
    el.classList.add('drag-over');
  }
}
function widgetDrop(e, el) {
  e.preventDefault();
  el.classList.remove('drag-over');
  if (!_dragWidget || _dragWidget === el) return;
  const grid = el.parentNode;
  const kids = [...grid.children];
  const si = kids.indexOf(_dragWidget);
  const ti = kids.indexOf(el);
  if (si < ti) grid.insertBefore(_dragWidget, el.nextSibling);
  else grid.insertBefore(_dragWidget, el);
  const newOrder = [...grid.querySelectorAll('.widget')].map(w => w.dataset.wid);
  if (!CFG.dashboard) CFG.dashboard = {};
  CFG.dashboard.widgets = newOrder;
  saveCfg(CFG);
}
function toggleWidgetExpand(btn) {
  const w = btn.closest('.widget');
  w.classList.toggle('expanded');
  btn.textContent = w.classList.contains('expanded') ? '⤡' : '⤢';
}

// ── AI Engine ─────────────────────────────────────────────────────
const AI_SYSTEM =
  'You are an AI assistant built into MailCal, a personal email and calendar manager. ' +
  'Every message includes a LIVE CONTEXT block with real data from the user\'s accounts — ' +
  'use it to answer questions accurately instead of guessing. ' +
  'If asked how many unread emails, how many tasks, or what\'s on the calendar, read the context and give the exact answer. ' +
  'Keep responses short and direct. When drafting emails include a greeting and sign-off. ' +
  'If the user asks to add a task, reply with exactly: TASK_ADD: [task text here] on its own line, then your normal reply.';

let _chatHistory = [];
let _aiCtxCache  = null;
let _aiCtxAge    = 0;
const AI_CTX_TTL = 5 * 60 * 1000;

async function buildAIContext(force) {
  if (!force && _aiCtxCache && (Date.now() - _aiCtxAge) < AI_CTX_TTL) return _aiCtxCache;

  const p    = getActiveProfile();
  const name = p ? p.name : 'the user';
  const now  = new Date();
  const lines = [
    '=== LIVE CONTEXT ===',
    'User: ' + name,
    'Date: ' + now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }),
    'Time: ' + now.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }),
    '',
  ];

  // Email
  if (CFG.gmail.connected) {
    lines.push('Gmail: connected (' + (CFG.gmail.email || 'unknown') + ')');
    try {
      const cnt  = await gmailGetUnread();
      const days = (CFG.general && CFG.general.emailDays) || 7;
      lines.push('Unread email threads (last ' + days + ' days): ' + cnt);
    } catch(_) { lines.push('Unread count: could not fetch'); }
  } else { lines.push('Gmail: not connected'); }

  if (CFG.outlook.connected) {
    lines.push('Outlook: connected (' + (CFG.outlook.email || 'unknown') + ')');
    try { lines.push('Outlook unread: ' + (await outlookGetUnread())); } catch(_) {}
  }

  // Calendar
  if (CFG.googleCal.connected || CFG.outlookCal.connected) {
    try {
      const evts = CFG.googleCal.connected ? await googleCalGetEvents(10) : await outlookCalGetEvents(10);
      const todayS = new Date(); todayS.setHours(0,0,0,0);
      const todayE = new Date(); todayE.setHours(23,59,59,999);
      const todays = evts.filter(e => { const d = new Date((e.start||{}).dateTime||(e.start||{}).date||0); return d >= todayS && d <= todayE; });
      const future = evts.filter(e => { const d = new Date((e.start||{}).dateTime||(e.start||{}).date||0); return d > todayE; }).slice(0,5);
      lines.push('');
      lines.push("Today's calendar (" + todays.length + " events):");
      if (todays.length) todays.forEach(e => {
        const t = new Date((e.start||{}).dateTime||(e.start||{}).date||0);
        lines.push('  - ' + t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) + ': ' + (e.summary||e.subject||'Untitled'));
      }); else lines.push('  - No events today');
      if (future.length) {
        lines.push('Upcoming events:');
        future.forEach(e => {
          const t = new Date((e.start||{}).dateTime||(e.start||{}).date||0);
          lines.push('  - ' + t.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) + ': ' + (e.summary||e.subject||'Untitled'));
        });
      }
    } catch(_) { lines.push('Calendar: could not fetch'); }
  } else { lines.push('Calendar: not connected'); }

  // Tasks
  const tasks = CFG.tasks || [];
  lines.push('');
  lines.push('Tasks (' + tasks.length + ' total):');
  if (tasks.length) tasks.slice(0,10).forEach(t => lines.push('  - ' + (t.text || t)));
  else lines.push('  - No tasks');

  // User preferences
  const dp = CFG.digest || {};
  if (dp.userContext || dp.vipSenders || dp.lowPriority) {
    lines.push('', 'User email preferences:');
    if (dp.userContext) lines.push('  ' + dp.userContext);
    if (dp.vipSenders)  lines.push('  VIP senders: ' + dp.vipSenders);
    if (dp.lowPriority) lines.push('  Low priority: ' + dp.lowPriority);
  }

  lines.push('=== END CONTEXT ===');
  _aiCtxCache = lines.join('\n');
  _aiCtxAge   = Date.now();
  return _aiCtxCache;
}

async function callAI(userText, _skipCtx) {
  const provider = CFG.ai.active;
  _chatHistory.push({ role: 'user', content: userText });

  let sys = AI_SYSTEM;
  if (!_skipCtx) {
    try { sys = AI_SYSTEM + '\n\n' + (await buildAIContext()); } catch(_) {}
  }

  const messages = [{ role: 'system', content: sys }, ..._chatHistory];
  let reply;
  if      (provider === 'ollama')  reply = await _callOllama(messages);
  else if (provider === 'gemini')  reply = await _callGemini(messages);
  else if (provider === 'openai')  reply = await _callOpenAI(messages);
  else if (provider === 'claude')  reply = await _callClaude(messages);
  else throw new Error('No AI provider selected. Go to Settings → AI Assistant.');

  // Auto-add task if AI includes TASK_ADD directive
  const taskMatch = reply.match(/^TASK_ADD:\s*(.+)$/m);
  if (taskMatch) {
    const taskText = taskMatch[1].trim();
    if (!CFG.tasks) CFG.tasks = [];
    CFG.tasks.push({ text: taskText, done: false, created: Date.now() });
    saveCfg(CFG);
    reply = reply.replace(/^TASK_ADD:.+\n?/m, '').trim() + '\n\n✓ Added to your tasks: "' + taskText + '"';
  }

  _chatHistory.push({ role: 'assistant', content: reply });
  return reply;
}

async function _callOllama(messages) {
  const base  = (CFG.ai.ollama.url || 'http://localhost:11434').replace(/\/$/, '');
  const model = CFG.ai.ollama.model || 'llama3.1:8b';
  const res = await fetch(base + '/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model, messages, stream: false }),
  });
  if (!res.ok) throw new Error('Ollama error ' + res.status + '. Make sure Ollama is running.');
  const d = await res.json();
  return d.message.content;
}

async function _callGemini(messages) {
  const key = CFG.ai.gemini.key;
  if (!key) throw new Error('No Gemini API key set. Go to Settings → AI Assistant.');
  const model = CFG.ai.gemini.model || 'gemini-2.0-flash';
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + key;
  const contents = messages
    .filter(m => m.role !== 'system')
    .map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
  const sys = messages.find(m => m.role === 'system');
  const body = { contents };
  if (sys) body.systemInstruction = { parts: [{ text: sys.content }] };
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error('Gemini: ' + (e.error?.message || res.statusText)); }
  const d = await res.json();
  return d.candidates[0].content.parts[0].text;
}

async function _callOpenAI(messages) {
  const key   = CFG.ai.openai.key;
  const model = CFG.ai.openai.model || 'gpt-4o-mini';
  if (!key) throw new Error('No OpenAI API key set. Go to Settings → AI Assistant.');
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({ model, messages }),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error('OpenAI: ' + (e.error?.message || res.statusText)); }
  const d = await res.json();
  return d.choices[0].message.content;
}

async function _callClaude(messages) {
  throw new Error('Claude cannot be called directly from a browser due to CORS restrictions. Use Gemini, OpenAI, or Ollama instead.');
}

function _aiAddBubble(containerEl, text, who, fontSize) {
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  if (fontSize) b.style.fontSize = fontSize;
  b.textContent = text;
  containerEl.appendChild(b);
  containerEl.scrollTop = containerEl.scrollHeight;
  return b;
}

async function miniAiSend() {
  const inp  = document.getElementById('miniAiInp');
  const msgs = document.getElementById('miniAiMsgs');
  if (!inp || !msgs || !inp.value.trim()) return;
  const txt = inp.value.trim();
  inp.value = '';
  inp.disabled = true;
  _aiAddBubble(msgs, txt, 'user', '11px');
  const thinking = _aiAddBubble(msgs, '…', 'ai', '11px');
  try {
    const reply = await callAI(txt);
    thinking.textContent = reply;
  } catch (e) {
    thinking.textContent = e.message;
    thinking.style.color = 'var(--red)';
  } finally {
    inp.disabled = false;
    inp.focus();
  }
}

function renderHome() {
  const p    = getActiveProfile();
  const name = p ? p.name.split(' ')[0] : 'there';
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

// ── Gmail Draft Creation ──────────────────────────────────────────
async function createGmailDraft(email, replyBody) {
  const token = await getGoogleToken();
  const myEmail = CFG.gmail.email || 'me';
  const subject = email.subject.match(/^re:/i) ? email.subject : 'Re: ' + email.subject;
  const raw = [
    'From: ' + myEmail,
    'To: ' + (email.fromEmail || email.fromName),
    'Subject: ' + subject,
    'Content-Type: text/plain; charset=UTF-8',
    '',
    replyBody
  ].join('\r\n');
  // base64url encode
  const encoded = btoa(unescape(encodeURIComponent(raw)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const body = { message: { raw: encoded } };
  if (email.threadId) body.message.threadId = email.threadId;
  return fetch('https://gmail.googleapis.com/gmail/v1/users/me/drafts', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(r => r.json());
}

async function draftReplies() {
  if (!CFG.gmail.connected) { alert('Connect Gmail first in Settings.'); return; }

  // Only use emails the AI specifically identified — never fetch random emails
  if (!_aiReplyEmails) {
    alert('Run AI Analysis in Email Digest first so the AI can identify which emails need replies.');
    return;
  }
  if (_aiReplyEmails.length === 0) {
    alert('No emails need a reply right now — the AI found nothing to draft.');
    return;
  }

  const emails = _aiReplyEmails;

  const container = document.getElementById('content');
  container.innerHTML =
    '<div class="tasks-view">' +
      '<div class="page-title">Draft Email Replies</div>' +
      '<div class="page-sub" id="draftSub">Drafting ' + emails.length + ' AI-identified repl' + (emails.length === 1 ? 'y' : 'ies') + '…</div>' +
      '<div class="draft-progress" id="draftProgress"></div>' +
      '<div id="draftResult" style="margin-top:16px"></div>' +
    '</div>';

  const prog = document.getElementById('draftProgress');
  document.getElementById('draftSub').textContent =
    (fromAI ? 'AI identified ' : 'Found ') + emails.length + ' email' + (emails.length > 1 ? 's' : '') + ' needing a reply. Drafting now…';

  // Render rows in queued state
  prog.innerHTML = emails.map((e, i) =>
    '<div class="draft-row" id="drow_' + i + '">' +
      '<div class="draft-status queued" id="dst_' + i + '"></div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-weight:700;font-size:12px">' + e.fromName + '</div>' +
        '<div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + e.subject + '</div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--dim)">' + e.time + '</div>' +
    '</div>'
  ).join('');

  let doneCount = 0, errCount = 0;
  const prefs = CFG.digest || {};

  for (let i = 0; i < emails.length; i++) {
    const e = emails[i];
    const stEl = document.getElementById('dst_' + i);
    if (stEl) { stEl.className = 'draft-status working'; stEl.textContent = ''; }

    try {
      const prefHint = prefs.userContext ? '\n\nContext about the sender: ' + prefs.userContext : '';
      const prompt = 'Draft a professional, concise email reply to this message.' + prefHint +
        '\n\nFrom: ' + e.fromName + '\nSubject: ' + e.subject + '\nPreview: ' + e.snippet +
        '\n\nWrite ONLY the email body — no subject line, no "Here is a draft" preamble. Sign off with ' +
        (getActiveProfile() ? getActiveProfile().name : 'me') + '.';
      const reply = await callAI(prompt, true);
      await createGmailDraft(e, reply);
      if (stEl) { stEl.className = 'draft-status done'; stEl.textContent = '✓'; }
      doneCount++;
    } catch(err) {
      if (stEl) { stEl.className = 'draft-status err'; stEl.textContent = '✗'; }
      const row = document.getElementById('drow_' + i);
      if (row) row.insertAdjacentHTML('beforeend', '<div style="font-size:10px;color:var(--red);margin-top:3px">' + err.message + '</div>');
      errCount++;
    }
  }

  const res = document.getElementById('draftResult');
  if (res) {
    res.innerHTML =
      '<div style="padding:14px 16px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:10px">' +
        '<div style="font-size:13px;font-weight:700;color:var(--green);margin-bottom:4px">✓ ' + doneCount + ' draft' + (doneCount !== 1 ? 's' : '') + ' saved to Gmail</div>' +
        '<div style="font-size:12px;color:var(--muted)">Open Gmail → Drafts to review and send. Each draft is pre-addressed and ready — just read it over before hitting send.</div>' +
        (errCount ? '<div style="font-size:11px;color:var(--red);margin-top:6px">' + errCount + ' failed — check errors above.</div>' : '') +
      '</div>' +
      '<button class="task-add-btn" style="margin-top:12px" onclick="renderTasks()">← Back to Tasks</button>';
  }
}

const _DG_COLORS = ['#6366f1','#8b5cf6','#ec4899','#f97316','#22c55e','#06b6d4','#ef4444','#d97706'];
function _dgColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (name.charCodeAt(i) + ((h << 5) - h)) | 0;
  return _DG_COLORS[Math.abs(h) % _DG_COLORS.length];
}
function _fmtTime(dateStr) {
  if (!dateStr) return '';
  const d  = new Date(dateStr);
  const dh = (Date.now() - d) / 3600000;
  if (dh < 1)  return Math.round(dh * 60) + 'm ago';
  if (dh < 24) return Math.round(dh) + 'h ago';
  if (dh < 48) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

async function _gmailFetch(path, token) {
  return fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path,
    { headers: { Authorization: 'Bearer ' + token } }).then(r => r.json());
}

// Returns Gmail exclusion string for promotions/newsletters/noise
function _noiseFilter() {
  const dp = (CFG.digest && CFG.digest.gmail) ? CFG.digest.gmail : {};
  if (dp.filterNoise === false) return '';
  return ' -category:promotions -category:social -category:updates -category:forums';
}

async function gmailGetDigestStats(days) {
  const token = await getGoogleToken();
  const ap   = (days === 'all' || days >= 90) ? '' : (' after:' + Math.floor((Date.now() - days * 86400000) / 1000));
  const tdAp = ' after:' + Math.floor((Date.now() - 86400000) / 1000);
  const nf   = _noiseFilter();
  const q    = s => 'threads?q=' + encodeURIComponent(s) + '&maxResults=500';
  const [a, b, c, d] = await Promise.all([
    _gmailFetch(q('is:unread in:inbox' + nf + ap),                                                                    token),
    _gmailFetch(q('is:unread is:important in:inbox' + nf + ap),                                                       token),
    _gmailFetch('threads?q=' + encodeURIComponent('is:unread is:important in:inbox' + nf + ap) + '&maxResults=200', token),
    _gmailFetch('threads?q=' + encodeURIComponent('in:inbox' + nf + tdAp)               + '&maxResults=200', token),
  ]);
  const cnt = r => { const n = (r.threads || []).length; return r.nextPageToken ? n + '+' : n; };
  return { unread: cnt(a), important: cnt(b), needsReply: cnt(c), today: cnt(d) };
}

async function gmailListUnread(query, max) {
  const token = await getGoogleToken();
  const list  = await _gmailFetch('messages?q=' + encodeURIComponent(query) + '&maxResults=' + (max || 15), token);
  const msgs  = list.messages || [];
  if (!msgs.length) return [];
  const details = await Promise.all(msgs.map(m =>
    _gmailFetch('messages/' + m.id + '?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date', token)
  ));
  return details.map(msg => {
    const hdrs = (msg.payload && msg.payload.headers) || [];
    const h    = n => (hdrs.find(x => x.name.toLowerCase() === n) || {}).value || '';
    const raw  = h('from');
    const nm   = raw.match(/^"?([^"<]+)"?\s*</);
    const fromName = (nm ? nm[1].trim() : raw.replace(/<.*>/, '').trim()) || raw;
    const dateObj  = h('date') ? new Date(h('date')) : null;
    let time = '';
    if (dateObj) {
      const dh = (Date.now() - dateObj) / 3600000;
      if (dh < 1) time = Math.round(dh * 60) + 'm';
      else if (dh < 24) time = Math.round(dh) + 'h';
      else if (dh < 48) time = 'Yesterday';
      else time = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    const lbl = msg.labelIds || [];
    const emailMatch = raw.match(/<(.+?)>/);
    const fromEmail = emailMatch ? emailMatch[1] : raw.trim();
    return {
      id: msg.id, threadId: msg.threadId, fromName, fromEmail,
      initial: fromName.charAt(0).toUpperCase(),
      color: _dgColor(fromName),
      subject: h('subject') || '(No subject)',
      snippet: (msg.snippet || '').replace(/&amp;/g,'&').replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)),
      time,
      ageH: dateObj ? (Date.now() - dateObj) / 3600000 : 0,
      isImportant: lbl.includes('IMPORTANT'),
    };
  });
}

    const ap   = ' after:' + Math.floor((Date.now() - days * 86400000) / 1000);
    let msgs;
    if (_digestAccount === 'outlook') {
      const since = new Date(Date.now() - days * 86400000).toISOString();
      msgs = await outlookListMessages({ isRead: false, since }, 20);
    } else {
      msgs = await gmailListUnread('is:unread in:inbox' + _noiseFilter() + ap, 20);
    }
    if (!msgs.length) { out.textContent = 'No unread emails to analyze.'; btn.textContent = '✦ Analyze with AI'; btn.disabled = false; return; }

    const dp = _getDigestPrefs();
    const prefBlock = (dp.userContext || dp.vipSenders || dp.lowPriority)
      ? '\n\nUSER PREFERENCES (use these to classify emails):\n' +
        (dp.userContext ? 'About the user: ' + dp.userContext + '\n' : '') +
        (dp.vipSenders  ? 'VIP senders (always urgent/important): ' + dp.vipSenders + '\n' : '') +
        (dp.lowPriority ? 'Low priority (de-emphasize): ' + dp.lowPriority + '\n' : '')
      : '';

    const list = msgs.map((m, i) =>
      (i+1) + '. From: ' + m.fromName + ' | Subject: ' + m.subject + ' | Age: ' + m.time + ' | Preview: ' + m.snippet.slice(0, 100)
    ).join('\n');

    const prompt = 'You are analyzing someone\'s email inbox.' + prefBlock + '\n\nHere are their ' + msgs.length + ' most recent unread emails:\n\n' + list +
      '\n\nBased on the user preferences above (if provided), respond in EXACTLY this format:\nSUMMARY: [2 sentences summarizing the inbox]\nURGENT: [comma-separated email numbers needing immediate action per the user\'s priorities, or "none"]\nREPLY: [comma-separated email numbers needing a reply, or "none"]\nACTION: [the single most important thing to do right now, max 15 words]';

    const response = await callAI(prompt);
    const get = (key) => { const m = response.match(new RegExp(key + ':\\s*(.+)')); return m ? m[1].trim() : ''; };
    const summary = get('SUMMARY'), urgent = get('URGENT'), reply = get('REPLY'), action = get('ACTION');

    // ── Urgent emails in AI card ───────────────────────────────────
    let urgentHtml = '';
    if (urgent && urgent.toLowerCase() !== 'none') {
      const idxs = urgent.split(',').map(s => parseInt(s.trim()) - 1).filter(n => !isNaN(n) && msgs[n]);
      if (idxs.length) {
        urgentHtml = '<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--red);margin:10px 0 5px">⚡ AI-Detected Urgent (' + idxs.length + ')</div>' +
          '<div class="dg-urgent-list">' +
          idxs.map(i => '<div class="dg-urgent-item"><div class="dg-urgent-dot"></div>' +
            '<div><strong>' + msgs[i].fromName + '</strong> — ' + msgs[i].subject + '</div></div>'
          ).join('') + '</div>';
      }
    }

    // ── Needs Reply section — AI-driven ───────────────────────────
    const repEl = document.getElementById('dgReplySec');
    if (repEl) {
      let replyIdxs = [];
      if (reply && reply.toLowerCase() !== 'none') {
        replyIdxs = reply.split(',').map(s => parseInt(s.trim()) - 1).filter(n => !isNaN(n) && msgs[n]);
      }
      const replyCount = replyIdxs.length;
      _aiReplyEmails = replyIdxs.map(i => msgs[i]); // save for task drafting
      const replyBody = replyCount
        ? replyIdxs.map(i => _dgRow(msgs[i])).join('')
        : '<div class="dg-empty">No emails need a reply today — you\'re all caught up!</div>';
      repEl.innerHTML = _dgSection('⏰', 'Needs a Reply', 'var(--red)', replyCount || null, replyBody);
      const statEl = document.getElementById('dgStatReply');
      if (statEl) statEl.textContent = replyCount || '0';
    }

    out.innerHTML =
      (summary ? '<div class="dg-ai-out" style="margin-bottom:8px">' + summary + '</div>' : '') +
      (action  ? '<div class="dg-priority-box"><strong>→ Top priority:</strong> ' + action + '</div>' : '') +
      urgentHtml;

    btn.textContent = '✓ Done — Re-analyze'; btn.disabled = false;
  } catch(e) {
    out.innerHTML = '<div style="color:var(--red);font-size:12px">Analysis failed: ' + e.message + '</div>';
    btn.textContent = '✦ Analyze with AI'; btn.disabled = false;
  }
}

async function _loadDigestData() {
  if (_digestAccount === 'outlook') { await _loadOutlookDigestData(); return; }

  const days = _digestDays;
  const ap   = (days === 'all') ? '' : (' after:' + Math.floor((Date.now() - days * 86400000) / 1000));
  try {
    const nf = _noiseFilter();
    const spamAp = ' after:' + Math.floor((Date.now() - 30 * 86400000) / 1000);
    const [stats, impMsgs, allMsgs, spamMsgs] = await Promise.all([
      gmailGetDigestStats(days === 'all' ? 90 : days),
      gmailListUnread('is:unread is:important in:inbox' + nf + ap, 8),
      gmailListUnread('is:unread in:inbox' + nf + ap, 15),
      gmailListUnread('in:spam -category:promotions -category:social -category:updates' + spamAp, 10),
    ]);
    const s = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    s('dgStatUnread', stats.unread); s('dgStatImportant', stats.important);
    s('dgStatReply',  stats.needsReply); s('dgStatToday', stats.today);
    const wNum = document.getElementById('w-unread-count');
    if (wNum) wNum.textContent = stats.unread;

    const impEl = document.getElementById('dgImportantSec');
    if (impEl) impEl.innerHTML = _dgSection('⚡','Important & Urgent','var(--orange)', impMsgs.length || null,
      impMsgs.length ? impMsgs.map(_dgRow).join('') : '<div class="dg-empty">No important unread emails — all clear!</div>');

    const repEl = document.getElementById('dgReplySec');
    if (repEl) repEl.innerHTML = _dgSection('⏰','Needs a Reply','var(--red)', null,
      '<div class="dg-empty" style="display:flex;align-items:center;gap:8px">' +
        '<span>Run</span>' +
        '<button class="dg-ai-btn" style="padding:4px 10px;font-size:11px" onclick="digestAnalyzeAI()">✦ AI Analysis</button>' +
        '<span>above to detect which emails need a response today.</span>' +
      '</div>');

    const allEl = document.getElementById('dgAllSec');
    const period = days === 'all' ? '' : (' — Last ' + (days === 1 ? 'Day' : days + ' Days'));
    if (allEl) allEl.innerHTML = _dgSection('📬','All Unread' + period,'var(--accent)', allMsgs.length || null,
      allMsgs.length ? allMsgs.map(_dgRow).join('') : '<div class="dg-empty">No unread emails in this period.</div>');

    const spamEl = document.getElementById('dgSpamSec');
    if (spamEl) {
      const spamRows = spamMsgs.map(m => _dgRow({ ...m, isSpam: true })).join('');
      spamEl.innerHTML = _dgSection('⚠','Possible Important Spam','#eab308', spamMsgs.length || null,
        spamMsgs.length
          ? '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">These ended up in spam but may be legitimate. Last 30 days, excluding newsletters.</div>' + spamRows
          : '<div class="dg-empty">No suspicious spam found — your spam folder looks clean.</div>');
    }
  } catch(e) {
    console.error('Digest load error:', e);
  }
}

async function _loadOutlookDigestData() {
  const days  = _digestDays;
  const since = days === 'all' ? null : new Date(Date.now() - days * 86400000).toISOString();
  const todayCutoff = Date.now() - 86400000;
  try {
    const [allMsgs, impMsgs, unreadCount] = await Promise.all([
      outlookListMessages({ isRead: false, ...(since ? { since } : {}) }, 15),
      outlookListMessages({ isRead: false, importance: 'high', ...(since ? { since } : {}) }, 8),
      outlookGetUnread(),
    ]);
    const todayCount = allMsgs.filter(m => m.rawDate && new Date(m.rawDate).getTime() > todayCutoff).length;
    const s = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    s('dgStatUnread', unreadCount); s('dgStatImportant', impMsgs.length);
    s('dgStatReply', '—'); s('dgStatToday', todayCount);

    const impEl = document.getElementById('dgImportantSec');
    if (impEl) impEl.innerHTML = _dgSection('⚡','Important & Urgent','var(--orange)', impMsgs.length || null,
      impMsgs.length ? impMsgs.map(_dgRow).join('') : '<div class="dg-empty">No important unread emails — all clear!</div>');

    const repEl = document.getElementById('dgReplySec');
    if (repEl) repEl.innerHTML = _dgSection('⏰','Needs a Reply','var(--red)', null,
      '<div class="dg-empty" style="display:flex;align-items:center;gap:8px">' +
        '<span>Run</span>' +
        '<button class="dg-ai-btn" style="padding:4px 10px;font-size:11px" onclick="digestAnalyzeAI()">✦ AI Analysis</button>' +
        '<span>above to detect which emails need a response today.</span>' +
      '</div>');

    const period = days === 'all' ? '' : (' — Last ' + (days === 1 ? 'Day' : days + ' Days'));
    const allEl = document.getElementById('dgAllSec');
    if (allEl) allEl.innerHTML = _dgSection('📬','All Unread' + period,'var(--accent)', allMsgs.length || null,
      allMsgs.length ? allMsgs.map(_dgRow).join('') : '<div class="dg-empty">No unread emails in this period.</div>');

    // Outlook junk folder — fetch separately, best-effort
    const spamEl = document.getElementById('dgSpamSec');
    if (spamEl) {
      try {
        const junkToken = await getMicrosoftToken();
        const junkSince = new Date(Date.now() - 30 * 86400000).toISOString();
        const junkData  = await fetch(
          'https://graph.microsoft.com/v1.0/me/mailFolders/junkemail/messages?$filter=' +
          encodeURIComponent('isRead eq false and receivedDateTime ge ' + junkSince) +
          '&$top=10&$select=id,subject,from,receivedDateTime,bodyPreview,conversationId',
          { headers: { Authorization: 'Bearer ' + junkToken } }
        ).then(r => r.json());
        const junkMsgs = (junkData.value || []).map(m => {
          const fn = (m.from && m.from.emailAddress && m.from.emailAddress.name) || '?';
          return {
            id: m.id, threadId: m.conversationId, isSpam: true,
            fromName: fn, fromEmail: (m.from && m.from.emailAddress && m.from.emailAddress.address) || '',
            initial: fn.charAt(0).toUpperCase(), color: _dgColor(fn),
            subject: m.subject || '(no subject)', snippet: m.bodyPreview || '',
            time: _fmtTime(m.receivedDateTime), rawDate: m.receivedDateTime,
            ageH: m.receivedDateTime ? (Date.now() - new Date(m.receivedDateTime)) / 3600000 : 0,
            isImportant: false,
          };
        });
        spamEl.innerHTML = _dgSection('⚠','Possible Important Junk','#eab308', junkMsgs.length || null,
          junkMsgs.length
            ? '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Unread emails in your Junk folder from the last 30 days — check these in case something legitimate was caught.</div>' + junkMsgs.map(_dgRow).join('')
            : '<div class="dg-empty">No unread junk mail — your junk folder looks clean.</div>');
      } catch(_) {
        spamEl.innerHTML = '';
      }
    }
  } catch(e) {
    console.error('Outlook digest load error:', e);
  }
}
