// ── Google OAuth (GIS token client) ──────────────────────────────
let _googleTokenClient  = null;
let _googleTokenResolve = null;
let _googleTokenReject  = null;
let _googleTokenPromise = null; // dedup concurrent refresh calls
let _googleTokenSilent  = false; // true when current request is prompt:'none'

function _initGoogleTokenClient() {
  if (_googleTokenClient || !window.google || !GOOGLE_CLIENT_ID) return;
  _googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/calendar openid email profile',
    callback(response) {
      if (response.error) {
        if (_googleTokenSilent && _googleTokenResolve) {
          // Silent attempt failed — retry with visible prompt (brief flash, but always works)
          _googleTokenSilent = false;
          _googleTokenClient.requestAccessToken({ prompt: '', login_hint: CFG.gmail.email || '' });
          return;
        }
        if (_googleTokenReject) _googleTokenReject(new Error(response.error_description || response.error));
        _googleTokenResolve = _googleTokenReject = null;
        return;
      }
      CFG.gmail.accessToken = response.access_token;
      CFG.gmail.tokenExpiry = Date.now() + ((response.expires_in - 60) * 1000);
      if (_googleTokenResolve) _googleTokenResolve(response.access_token);
      _googleTokenResolve = _googleTokenReject = null;
    }
  });
}

async function getGoogleToken(forceRefresh, explicit) {
  if (!GOOGLE_CLIENT_ID) throw new Error('Google not configured');
  if (!forceRefresh && CFG.gmail.accessToken && CFG.gmail.tokenExpiry > Date.now()) {
    return CFG.gmail.accessToken;
  }
  if (!forceRefresh && !explicit && _googleTokenPromise) return _googleTokenPromise;
  _initGoogleTokenClient();
  if (!_googleTokenClient) throw new Error('Google Sign-In library not loaded yet — please refresh and try again.');
  _googleTokenPromise = new Promise((resolve, reject) => {
    _googleTokenResolve = resolve;
    _googleTokenReject  = reject;
    _googleTokenSilent  = !explicit;
    // Try fully silent first; callback auto-retries with '' if it fails
    _googleTokenClient.requestAccessToken({
      prompt: explicit ? '' : 'none',
      login_hint: CFG.gmail.email || ''
    });
  });
  _googleTokenPromise.catch(() => {}).finally(() => { _googleTokenPromise = null; _googleTokenSilent = false; });
  return _googleTokenPromise;
}

// ── Microsoft OAuth (MSAL.js) ─────────────────────────────────────
let _msalApp     = null;
let _msalAccount = null;
const MSAL_SCOPES = ['Mail.ReadWrite', 'Mail.Send', 'Calendars.ReadWrite', 'User.Read'];

function _getMsalApp() {
  if (_msalApp) return _msalApp;
  if (!window.msal || !MICROSOFT_CLIENT_ID) return null;
  _msalApp = new msal.PublicClientApplication({
    auth: {
      clientId: MICROSOFT_CLIENT_ID,
      authority: 'https://login.microsoftonline.com/common',
      redirectUri: window.location.origin + window.location.pathname,
    },
    cache: { cacheLocation: 'localStorage' }
  });
  // Restore cached account
  const accounts = _msalApp.getAllAccounts();
  if (accounts.length) _msalAccount = accounts[0];
  return _msalApp;
}

async function getMicrosoftToken(forceRefresh) {
  if (!MICROSOFT_CLIENT_ID) throw new Error('Microsoft not configured');
  const app = _getMsalApp();
  if (!app) throw new Error('MSAL library not loaded yet — please refresh and try again.');
  if (!forceRefresh && CFG.outlook.accessToken && CFG.outlook.tokenExpiry > Date.now()) {
    return CFG.outlook.accessToken;
  }
  const account = _msalAccount || (app.getAllAccounts()[0] || null);
  if (account) {
    try {
      const result = await app.acquireTokenSilent({ scopes: MSAL_SCOPES, account });
      _msalAccount = result.account;
      CFG.outlook.accessToken = result.accessToken;
      CFG.outlook.tokenExpiry = Date.now() + 3500 * 1000;
      return result.accessToken;
    } catch (_) { /* fall through to popup */ }
  }
  const result = await app.acquireTokenPopup({ scopes: MSAL_SCOPES });
  _msalAccount = result.account;
  CFG.outlook.accessToken = result.accessToken;
  CFG.outlook.tokenExpiry = Date.now() + 3500 * 1000;
  return result.accessToken;
}

// ── Email & Calendar API helpers ──────────────────────────────────
async function gmailGetUnread() {
  const token = await getGoogleToken();
  const days  = (CFG.general && CFG.general.emailDays) || 7;
  const after = Math.floor((Date.now() - days * 86400000) / 1000);
  const nf    = _noiseFilter();
  const data  = await fetch(
    `https://gmail.googleapis.com/gmail/v1/users/me/threads?q=${encodeURIComponent('is:unread in:inbox' + nf + ' after:' + after)}&maxResults=500`,
    { headers: { Authorization: 'Bearer ' + token } }
  ).then(r => r.json());
  const count = (data.threads || []).length;
  return data.nextPageToken ? count + '+' : count;
}

async function googleCalGetEvents(max) {
  const token = await getGoogleToken();
  const now   = new Date().toISOString();
  const end   = new Date(Date.now() + 7 * 86400000).toISOString();
  const data  = await fetch(
    `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${now}&timeMax=${end}&maxResults=${max || 5}&singleEvents=true&orderBy=startTime`,
    { headers: { Authorization: 'Bearer ' + token } }
  ).then(r => r.json());
  return data.items || [];
}

async function outlookGetUnread() {
  const token = await getMicrosoftToken();
  const days  = (CFG.general && CFG.general.emailDays) || 7;
  const since = new Date(Date.now() - days * 86400000).toISOString();
  const data  = await fetch(
    `https://graph.microsoft.com/v1.0/me/messages?$filter=isRead eq false and receivedDateTime ge ${since}&$count=true&$top=1`,
    { headers: { Authorization: 'Bearer ' + token, 'ConsistencyLevel': 'eventual' } }
  ).then(r => r.json());
  return data['@odata.count'] != null ? data['@odata.count'] : (data.value ? data.value.length : 0);
}

async function outlookListMessages(opts, max) {
  const token = await getMicrosoftToken();
  const filters = [];
  if (opts.isRead === false) filters.push('isRead eq false');
  if (opts.importance)       filters.push("importance eq '" + opts.importance + "'");
  if (opts.since)            filters.push('receivedDateTime ge ' + opts.since);
  const qs = (filters.length ? '$filter=' + encodeURIComponent(filters.join(' and ')) + '&' : '') +
    '$top=' + (max || 15) + '&$select=id,subject,from,receivedDateTime,isRead,importance,conversationId,bodyPreview,inferenceClassification';
  const data = await fetch(
    'https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messages?' + qs,
    { headers: { Authorization: 'Bearer ' + token } }
  ).then(r => r.json());
  return (data.value || []).map(m => {
    const fromName  = (m.from && m.from.emailAddress && m.from.emailAddress.name)    || '?';
    const fromEmail = (m.from && m.from.emailAddress && m.from.emailAddress.address) || '';
    const ageH = m.receivedDateTime ? (Date.now() - new Date(m.receivedDateTime)) / 3600000 : 0;
    return {
      id: m.id, threadId: m.conversationId,
      fromName, fromEmail,
      initial:     fromName.charAt(0).toUpperCase(),
      color:       _dgColor(fromName),
      subject:     m.subject || '(no subject)',
      snippet:     m.bodyPreview || '',
      time:        _fmtTime(m.receivedDateTime),
      rawDate:     m.receivedDateTime,
      ageH,
      isImportant: m.importance === 'high',
      isRead:      m.isRead,
      focused:     m.inferenceClassification !== 'other',
    };
  });
}

async function outlookCalGetEvents(max) {
  const token = await getMicrosoftToken();
  const now   = new Date().toISOString();
  const end   = new Date(Date.now() + 7 * 86400000).toISOString();
  const data  = await fetch(
    `https://graph.microsoft.com/v1.0/me/calendarView?startDateTime=${now}&endDateTime=${end}&$top=${max || 5}&$orderby=start/dateTime`,
    { headers: { Authorization: 'Bearer ' + token } }
  ).then(r => r.json());
  return data.value || [];
}

// ── Actions ───────────────────────────────────────────────────────
async function connectOAuth(provider) {
  if (provider === 'gmail') {
    if (!GOOGLE_CLIENT_ID) { alert('Google is not yet configured for this app. Please contact support.'); return; }
    _initGoogleTokenClient();
    if (!_googleTokenClient) { alert('Google Sign-In is still loading. Please try again in a moment.'); return; }
    try {
      const token = await new Promise((resolve, reject) => {
        _googleTokenResolve = resolve;
        _googleTokenReject  = reject;
        _googleTokenClient.requestAccessToken({ prompt: 'consent' });
      });
      const info = await fetch('https://www.googleapis.com/oauth2/v3/userinfo',
        { headers: { Authorization: 'Bearer ' + token } }).then(r => r.json());
      CFG.gmail.connected = true;
      CFG.gmail.email     = info.email || '';
      saveCfg(CFG);
      renderSettings('accounts');
    } catch(e) {
      if (e.message !== 'access_denied') alert('Google sign-in failed: ' + e.message);
    }
  } else if (provider === 'outlook') {
    if (!MICROSOFT_CLIENT_ID) { alert('Microsoft is not yet configured for this app. Please contact support.'); return; }
    const app = _getMsalApp();
    if (!app) { alert('Microsoft Sign-In is still loading. Please try again in a moment.'); return; }
    try {
      const result = await app.loginPopup({ scopes: MSAL_SCOPES, prompt: 'select_account' });
      _msalAccount = result.account;
      CFG.outlook.accessToken = result.accessToken;
      CFG.outlook.tokenExpiry = Date.now() + 3500 * 1000;
      CFG.outlook.connected = true;
      CFG.outlook.email     = result.account.username || '';
      saveCfg(CFG);
      renderSettings('accounts');
    } catch(e) {
      if (e.errorCode !== 'user_cancelled') alert('Microsoft sign-in failed: ' + e.message);
    }
  }
}

function connectCal(provider) {
  if (provider === 'google') {
    CFG.googleCal.connected = true;
  } else {
    CFG.outlookCal.connected = true;
  }
  saveCfg(CFG);
  renderSettings('calendar');
}

function disconnect(key) {
  if (key === 'gmail') {
    CFG.gmail     = { connected: false, email: '', accessToken: '', tokenExpiry: 0 };
    CFG.googleCal = { connected: false };
  }
  if (key === 'outlook') {
    CFG.outlook    = { connected: false, email: '', accessToken: '', tokenExpiry: 0 };
    CFG.outlookCal = { connected: false };
    if (_msalApp) { try { _msalApp.clearCache(); } catch(_) {} }
    _msalAccount = null;
  }
  if (key === 'googleCal')  CFG.googleCal  = { connected: false };
  if (key === 'outlookCal') CFG.outlookCal = { connected: false };
  saveCfg(CFG);
  if (key === 'gmail' || key === 'outlook') renderSettings('accounts');
  else renderSettings('calendar');
}

async function saveAI(provider) {
  saveCfg(CFG);
  const btn = event.target;
  const orig = btn.textContent;
  btn.textContent = 'Testing…';
  btn.disabled = true;
  try {
    const prev = CFG.ai.active;
    CFG.ai.active = provider;
    const prevHistory = _chatHistory;
    _chatHistory = [];
    await callAI('Say only: "Connected!" and nothing else.', true);
    _chatHistory = prevHistory;
    CFG.ai.active = prev;
    saveCfg(CFG);
    btn.textContent = '✓ Connected!';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = 'rgba(34,197,94,.3)';
  } catch (e) {
    btn.textContent = '✗ Failed — ' + e.message.slice(0, 40);
    btn.style.color = 'var(--red)';
    btn.style.borderColor = 'rgba(239,68,68,.3)';
  } finally {
    btn.disabled = false;
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 3000);
  }
}

const OLLAMA_DESCS = {
  'llama3.2:3b':  ['⚡ Lightning fast',   'Best for quick questions and everyday tasks. Starts instantly.',        '~2 GB RAM'],
  'llama3.1:8b':  ['⭐ Best all-around',  'The sweet spot — fast enough and smart enough for most people.',        '~5 GB RAM'],
  'mistral:7b':   ['✍ Great for writing', 'Excellent at drafting emails, summaries, and structured replies.',      '~4 GB RAM'],
  'gemma3:12b':   ['🧠 Smarter',          'Stronger reasoning. Better for complex questions and analysis.',        '~8 GB RAM'],
  'llama3.1:70b': ['💪 Most powerful',    'Highest quality, but needs a powerful PC. Not for most users.',        '~40 GB RAM'],
  'custom':       ['Custom model',        'Enter any model name from your Ollama library.',                       ''],
};

function buildOllamaModelPicker(ai) {
  const cur = (ai && ai.ollama && ai.ollama.model) ? ai.ollama.model : 'llama3.1:8b';
  const isCustom = !OLLAMA_DESCS[cur] || cur === 'custom';
  const desc = OLLAMA_DESCS[isCustom ? 'custom' : cur];
  const options = Object.keys(OLLAMA_DESCS).map(function(k) {
    const label = k === 'custom' ? 'Custom model…' : (k + ' — ' + OLLAMA_DESCS[k][0]);
    const sel = (!isCustom && cur === k) || (isCustom && k === 'custom') ? ' selected' : '';
    return '<option value="' + k + '"' + sel + '>' + label + '</option>';
  }).join('');
  const infoHtml = '<span style="color:var(--text);font-weight:600">' + desc[0] + '</span> &nbsp;·&nbsp; ' + desc[1] +
    (desc[2] ? ' &nbsp;·&nbsp; <span style="color:var(--dim)">' + desc[2] + '</span>' : '');
  const customStyle = isCustom ? 'display:block' : 'display:none';
  const customVal = isCustom ? (cur === 'custom' ? '' : cur) : '';
  return '<select class="field-input" onchange="ollamaModelChange(this.value)">' + options + '</select>' +
    '<div id="ollamaModelInfo" class="field-help" style="margin-top:4px">' + infoHtml + '</div>' +
    '<input id="ollamaCustomInput" class="field-input" style="margin-top:6px;' + customStyle + '" placeholder="e.g. phi3:mini" value="' + customVal + '" oninput="CFG.ai.ollama.model=this.value">';
}

function ollamaModelChange(val) {
  const d = OLLAMA_DESCS[val] || OLLAMA_DESCS['custom'];
  const info = document.getElementById('ollamaModelInfo');
  const custom = document.getElementById('ollamaCustomInput');
  if (info) info.innerHTML = `<span style="color:var(--text);font-weight:600">${d[0]}</span> &nbsp;·&nbsp; ${d[1]}${d[2] ? ` &nbsp;·&nbsp; <span style="color:var(--dim)">${d[2]}</span>` : ''}`;
  if (custom) custom.style.display = val === 'custom' ? 'block' : 'none';
  if (val !== 'custom') {
    CFG.ai.ollama.model = val;
    saveCfg(CFG);
  }
}

// ── Pending Screen (with live Realtime watch) ─────────────────────
let _realtimeCh = null;
let _pollTimer  = null;

function startApprovalWatch(userId) {
  stopApprovalWatch();
  const sb = getSB();
  if (!sb) return;

  _realtimeCh = sb.channel('approval:' + userId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'accounts', filter: `id=eq.${userId}` },
      (payload) => {
        if (payload.new.status === 'approved') { stopApprovalWatch(); launchApp(); }
        else if (payload.new.status === 'denied' || payload.new.status === 'revoked') {
          stopApprovalWatch();
          showDeniedScreen(AUTH_SESSION?.user?.email || '');
        }
      })
    .subscribe();

  // Polling fallback every 12 seconds
  _pollTimer = setInterval(async () => {
    const s = await getAuthStatus();
    if (s === 'approved') { stopApprovalWatch(); launchApp(); }
    else if (s === 'denied') { stopApprovalWatch(); showDeniedScreen(AUTH_SESSION?.user?.email || ''); }
  }, 12000);
}

function stopApprovalWatch() {
  if (_realtimeCh) { getSB()?.removeChannel(_realtimeCh); _realtimeCh = null; }
  if (_pollTimer)  { clearInterval(_pollTimer); _pollTimer = null; }
}

function showPendingScreen(email) {
  document.body.classList.add('ready');
  document.querySelectorAll('.auth-screen,.status-screen').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'status-screen';

      <div style="font-size:12px;color:var(--dim);margin-bottom:16px">Checking for approval automatically…</div>
      <button class="status-btn ghost" onclick="sbSignOut()">Sign Out</button>
    </div>`;
  document.body.appendChild(el);
  if (AUTH_SESSION?.user?.id) startApprovalWatch(AUTH_SESSION.user.id);
}

function showDeniedScreen(email) {

async function launchApp() {
  stopApprovalWatch();
  document.querySelectorAll('.auth-screen,.status-screen,.profile-setup,.landing-screen').forEach(e => e.remove());
  const ps = getPStore();
  if (!ps.active || !ps.profiles[ps.active]) {
    showProfileSetup(false);
    document.body.classList.add('ready');
  } else {
    CFG = loadCfg();
    if (!CFG.theme) CFG.theme = { accent: '', scheme: 'mono' };
    if (!CFG.theme.accent) {
      const p = getActiveProfile();
      if (p) { CFG.theme.accent = p.color; saveCfg(CFG); }
    }
    applyTheme();
    updateAvatarUI();
    // Pre-warm token in background so count appears without waiting on first render
    if (CFG.gmail.connected && GOOGLE_CLIENT_ID) {
      setTimeout(() => { _initGoogleTokenClient(); getGoogleToken().catch(() => {}); }, 0);
    }
    goHome();
    document.body.classList.add('ready');
  }
}

// ── Init ──────────────────────────────────────────────────────────
(async () => {
  try {
    if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data === 'SW_UPDATED') location.reload();
      });
    } else if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
      // Live reload on localhost
      const es = new EventSource('/__livereload');
      es.onmessage = e => { if (e.data === 'reload') location.reload(); };
    }

    // Handle password reset redirect
    const hash = new URLSearchParams(window.location.hash.slice(1));
    if (hash.get('type') === 'recovery') {
      renderAuthScreen();
      return;
    }

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                      || navigator.standalone === true;

    if (!supabaseConfigured()) {
      // Supabase keys not set — local-only mode
      const ps = getPStore();
      if (!ps.active || !ps.profiles[ps.active]) showProfileSetup(false);
      else { CFG = loadCfg(); applyTheme(); updateAvatarUI(); goHome(); }
      return;
    }

    let status;
    try {
      status = await getAuthStatus();
    } catch (e) {
      // Supabase unreachable — show landing/auth so user isn't stuck
      console.warn('Supabase auth check failed:', e);
      status = 'no_session';
    }

    if (status === 'no_session') {
      if (isStandalone) renderAuthScreen();
      else renderLanding();
    } else if (status === 'approved') {
      launchApp();
    } else if (status === 'denied' || status === 'revoked') {
      showDeniedScreen(AUTH_SESSION?.user?.email || '');
    } else {
      showPendingScreen(AUTH_SESSION?.user?.email || '');
    }

  } catch (e) {
    // Last-resort fallback — always show something
    console.error('Init error:', e);
    renderLanding();
  }
})()

</script>
</body>
</html>
